
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

mqtt:
  sensor:
    # ---------- Puissance et intensité ----------
    - name: "Puissance Apparente Linky"
      unique_id: linky_puissance_apparente
      state_topic: "winky/linky/power"
      device_class: apparent_power
      state_class: measurement
      unit_of_measurement: "VA"

    - name: "Intensité Instantanée Linky"
      unique_id: linky_intensite_instantanee
      state_topic: "winky/linky/iinst"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"

    - name: "Intensité Souscrite Linky"
      unique_id: linky_intensite_souscrite
      state_topic: "winky/linky/isousc"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"

    - name: "Alerte Dépassement Linky"
      unique_id: linky_alerte_depassement
      state_topic: "winky/linky/adps"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"

    - name: "Puissance Active Moyenne 10 min Linky"
      unique_id: linky_ccasn
      state_topic: "winky/linky/ccasn"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"

    - name: "Puissance Max Jour Linky"
      unique_id: linky_smaxsn
      state_topic: "winky/linky/smaxsn"
      device_class: apparent_power
      state_class: measurement
      unit_of_measurement: "VA"

    - name: "Puissance Max Veille Linky"
      unique_id: linky_smaxsn_veille
      state_topic: "winky/linky/smaxsn_1"
      device_class: apparent_power
      state_class: measurement
      unit_of_measurement: "VA"

    - name: "Puissance de Coupure Linky"
      unique_id: linky_pcoup
      state_topic: "winky/linky/pcoup"
      unit_of_measurement: "kVA"

    # ---------- Tension réseau ----------
    - name: "Tension Réseau Linky"
      unique_id: linky_tension_reseau
      state_topic: "winky/linky/urms1"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"

    - name: "Tension Moyenne 10 min Linky"
      unique_id: linky_tension_moyenne
      state_topic: "winky/linky/umoy1"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"

    # ---------- Index d'énergie ----------
    - name: "Index Total Consommé Linky"
      unique_id: linky_index_total_consomme
      state_topic: "winky/linky/east"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "Wh"

    - name: "Index Base Linky"
      unique_id: linky_index_base
      state_topic: "winky/linky/base"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "Wh"

    # ---------- Contrat et tarif ----------
    - name: "Adresse Compteur Linky"
      unique_id: linky_adco
      state_topic: "winky/linky/adco"

    - name: "Option Tarifaire Linky"
      unique_id: linky_option_tarifaire
      state_topic: "winky/linky/optarif"

    - name: "Période Tarifaire Linky"
      unique_id: linky_periode_tarifaire
      state_topic: "winky/linky/ptec"

    - name: "Index Tarifaire en Cours Linky"
      unique_id: linky_ntarf
      state_topic: "winky/linky/ntarf"

    - name: "Horodate Linky"
      unique_id: linky_date
      state_topic: "winky/linky/date"

    # ---------- Alimentation de l'ESP ----------
    - name: "Tension Début Linky"
      unique_id: linky_tension_debut
      state_topic: "winky/linky/tension_debut"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"

    - name: "Tension Fin Linky"
      unique_id: linky_tension_fin
      state_topic: "winky/linky/tension_fin"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"

template:
  - trigger:
      - platform: state
        entity_id:
          - sensor.index_base_linky

    sensor:
      - name: "Prochaine poubelle"
        state: >
          {% if is_state('input_select.poubelle_mode', 'Manuel') %}
            {{ states('input_select.poubelle_choix_manuel') }}
          {% else %}
            {{ states('input_select.poubelle_prochaine') }}
          {% endif %}

      - name: "Conso Jour"
        unit_of_measurement: "Wh"
        device_class: energy
        state: "{{ states('sensor.base_jour') | float(0) | round(0) }}"

      - name: "Conso Semaine"
        unit_of_measurement: "Wh"
        device_class: energy
        state: "{{ states('sensor.base_semaine') | float(0) | round(0) }}"

      - name: "Conso Mois"
        unit_of_measurement: "Wh"
        device_class: energy
        state: "{{ states('sensor.base_mois') | float(0) | round(0) }}"

      - name: "Coût Jour"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.base_jour') | float(0) / 1000
              * states('input_number.linky_prix_kwh') | float(0)) | round(2) }}

      - name: "Coût Semaine"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.base_semaine') | float(0) / 1000
              * states('input_number.linky_prix_kwh') | float(0)) | round(2) }}

      - name: "Coût Mois"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.base_mois') | float(0) / 1000
              * states('input_number.linky_prix_kwh') | float(0)) | round(2) }}

      - name: "Index Base Filtré"
        unique_id: linky_base_filtre_sensor
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "Wh"
        state: "{{ states('input_number.linky_base_filtre') | float(0) }}"

      - name: "Consommation Base"
        unique_id: consommation_base
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        state: >
          {{ states('sensor.index_base_filtre') | float(0) / 1000 }}

utility_meter:
  base_jour:
    source: sensor.index_base_filtre
    cycle: daily

  base_semaine:
    source: sensor.index_base_filtre
    cycle: weekly

  base_mois:
    source: sensor.index_base_filtre
    cycle: monthly

  consommation_base_jour:
    source: sensor.index_base_filtre
    cycle: daily

input_number:
  linky_base_filtre:
    name: Linky Base filtré
    min: 0
    max: 99999999
    step: 1
    mode: box

  linky_prix_kwh:
    name: Prix du kWh Base
    min: 0
    max: 1
    step: 0.0001
    unit_of_measurement: "€/kWh"
    mode: box

input_select:
  poubelle_mode:
    name: Mode poubelle
    options:
      - Automatique
      - Manuel
    icon: mdi:calendar-sync

  poubelle_choix_manuel:
    name: Poubelle manuelle
    options:
      - Jaune
      - Noire
    icon: mdi:trash-can

  poubelle_prochaine:
    name: Prochaine poubelle
    options:
      - Jaune
      - Noire
    icon: mdi:trash-can-outline
