- id: calcul_poubelle_automatique
  alias: "Calcul poubelle automatique"

  trigger:
    - platform: time
      at: "00:05:00"

    - platform: state
      entity_id: input_select.poubelle_mode

  condition:
    - condition: state
      entity_id: input_select.poubelle_mode
      state: "Automatique"

  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.poubelle_prochaine
      data:
        option: >
          {% set semaine = now().isocalendar().week %}
          {% if semaine % 2 == 0 %}
            Noire
          {% else %}
            Jaune
          {% endif %}

  mode: single