title: Énergie
path: energie
icon: mdi:home-lightning-bolt
type: sections
max_columns: 4
sections:
  - type: grid
    cards:
      - type: heading
        heading: ⚡ Résumé Linky
        heading_style: title
      - type: custom:mushroom-template-card
        primary: Puissance actuelle
        secondary: |
          {{ states('sensor.puissance_apparente_linky') }} VA
        icon: mdi:flash
        icon_color: amber
      - type: custom:mushroom-template-card
        primary: Intensité
        secondary: |
          {{ states('sensor.intensite_instantanee_linky') }} A
        icon: mdi:current-ac
        icon_color: blue
      - type: custom:mushroom-template-card
        primary: Tarif actuel
        secondary: |
          {{ states('sensor.linky_periode_tarifaire') | replace('.', '') }}
        icon: mdi:clock-outline
        color: green
        features_position: bottom
      - type: custom:mushroom-template-card
        primary: Intensité souscrite
        secondary: |
          {{ states('sensor.intensite_souscrite_linky') }} A
        icon: mdi:transmission-tower
      - type: custom:mushroom-template-card
        primary: Charge du contrat
        secondary: |
          {% set i = states('sensor.intensite_instantanee_linky')|float(0) %}
          {% set s = states('sensor.intensite_souscrite_linky')|float(0) %}
          {{ ((i / s * 100)|round(0)) if s > 0 else 0 }} %
        icon: mdi:gauge
        icon_color: >
          {% set i = states('sensor.intensite_instantanee_linky')|float(0) %} {%
          set s = states('sensor.intensite_souscrite_linky')|float(1) %} {% set
          p = i / s * 100 %} {{ 'red' if p > 90 else 'orange' if p > 70 else
          'green' }}
  - type: grid
    cards:
      - type: heading
        heading: 📈 Puissance
      - type: gauge
        entity: sensor.puissance_apparente_linky
        name: Puissance Linky
        min: 0
        max: 9000
        needle: true
        severity:
          green: 0
          yellow: 8000
          red: 8500
      - type: custom:apexcharts-card
        header:
          show: true
          title: Puissance Linky - 24h
        graph_span: 24h
        series:
          - entity: sensor.puissance_apparente_linky
            name: Instantanée (VA)
            color: orange
            type: line
            stroke_width: 2
      - type: custom:apexcharts-card
        header:
          show: true
          title: Pic de puissance - 7 jours
        graph_span: 7d
        span:
          end: day
        apex_config:
          chart:
            type: bar
        series:
          - entity: sensor.puissance_apparente_linky
            name: Max du jour
            color: red
            type: column
            group_by:
              func: max
              duration: 1d
      - type: custom:mushroom-template-card
        primary: Pic sur 24h
        secondary: |
          {{ states('sensor.puissance_max_24h_linky') }} VA
        icon: mdi:chart-bell-curve-cumulative
        icon_color: red
  - type: grid
    cards:
      - type: heading
        heading: 🔌 Intensité
      - type: custom:apexcharts-card
        header:
          show: true
          title: Intensité vs souscrite - 24h
        graph_span: 24h
        series:
          - entity: sensor.intensite_instantanee_linky
            name: Instantanée
            color: dodgerblue
            type: area
            stroke_width: 2
          - entity: sensor.intensite_souscrite_linky
            name: Souscrite
            color: red
            type: line
            curve: stepline
            stroke_width: 1
      - type: tile
        entity: sensor.alerte_depassement_linky
        name: Dépassement
        vertical: false
  - type: grid
    cards:
      - type: heading
        heading: 🔢 Index Linky
      - type: entities
        entities:
          - entity: sensor.index_total_consomme_linky
            name: Index total
          - entity: sensor.index_base_filtre
            name: Index Base
      - type: custom:apexcharts-card
        header:
          show: true
          title: Index Base - 30 jours
        graph_span: 30d
        series:
          - entity: sensor.index_base_filtre
            name: Base
            color: orange
  - type: grid
    cards:
      - type: heading
        heading: 📊 Consommation
      - type: custom:mushroom-template-card
        primary: |
          {{ (states('sensor.consommation_base_jour')|float(0) / 1000)|round(2) }} kWh
        secondary: |
          Coût du jour : {{ states('sensor.cout_jour') }} €
        icon: mdi:lightning-bolt
        icon_color: amber
        multiline_secondary: true
      - type: custom:apexcharts-card
        header:
          show: true
          title: Consommation Base - 30 jours
        graph_span: 30d
        span:
          end: day
        apex_config:
          chart:
            type: bar
          plotOptions:
            bar:
              columnWidth: 60%
        series:
          - entity: sensor.consommation_base_jour
            name: Base
            color: orange
            type: column
  - type: grid
    cards:
      - type: heading
        heading: 📡 Informations compteur
      - type: entities
        entities:
          - entity: sensor.adresse_compteur_linky
            name: Adresse compteur
          - entity: sensor.option_tarifaire_linky
            name: Option tarifaire
          - entity: sensor.linky_periode_tarifaire
            name: Période tarifaire
          - entity: sensor.intensite_souscrite_linky
            name: Intensité souscrite
          - entity: sensor.puissance_de_coupure_linky
            name: Puissance de coupure (estimée)
  - type: grid
    cards:
      - type: heading
        heading: 🔧 Boîtier Winky
      - type: custom:apexcharts-card
        header:
          show: true
          title: Tension d'alimentation ESP - 24h
        graph_span: 24h
        yaxis:
          - min: 3
            max: 5
            decimals: 2
        series:
          - entity: sensor.tension_debut_linky
            name: Début de cycle
            color: green
            type: line
          - entity: sensor.tension_fin_linky
            name: Fin de cycle
            color: red
            type: line
      - type: tile
        entity: sensor.tension_debut_linky
        name: Tension début
        vertical: false
      - type: tile
        entity: sensor.tension_fin_linky
        name: Tension fin
        vertical: false
cards: []

