
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

mqtt:
  sensor:
    # ---------- Puissance et intensité ----------
    - name: "Puissance Apparente Linky"
      unique_id: linky_puissance_apparente
      state_topic: "winky/linky/power"
      device_class: apparent_power
      state_class: measurement
      unit_of_measurement: "VA"

    - name: "Intensité Instantanée Linky"
      unique_id: linky_intensite_instantanee
      state_topic: "winky/linky/iinst"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"

    - name: "Intensité Souscrite Linky"
      unique_id: linky_intensite_souscrite
      state_topic: "winky/linky/isousc"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"

    - name: "Alerte Dépassement Linky"
      unique_id: linky_alerte_depassement
      state_topic: "winky/linky/adps"
      device_class: current
      state_class: measurement
      unit_of_measurement: "A"

    # ---------- Index d'énergie ----------
    - name: "Index Heures Creuses Linky"
      unique_id: linky_index_hc
      state_topic: "winky/linky/hchc"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "Wh"

    - name: "Index Heures Pleines Linky"
      unique_id: linky_index_hp
      state_topic: "winky/linky/hchp"
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "Wh"

    # ---------- Contrat et tarif ----------
    - name: "Adresse Compteur Linky"
      unique_id: linky_adco
      state_topic: "winky/linky/adco"

    - name: "Option Tarifaire Linky"
      unique_id: linky_option_tarifaire
      state_topic: "winky/linky/optarif"

    - name: "Période Tarifaire Linky"
      unique_id: linky_periode_tarifaire
      state_topic: "winky/linky/ptec"

    # ---------- Alimentation de l'ESP ----------
    - name: "Tension Début Linky"
      unique_id: linky_tension_debut
      state_topic: "winky/linky/tension_debut"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"

    - name: "Tension Fin Linky"
      unique_id: linky_tension_fin
      state_topic: "winky/linky/tension_fin"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: "V"

sensor:
  - platform: statistics
    name: "Puissance Max 24h Linky"
    entity_id: sensor.puissance_apparente_linky
    state_characteristic: value_max
    max_age:
      hours: 24

template:
  - trigger:
      - platform: state
        entity_id:
          - sensor.index_heures_pleines
          - sensor.index_heures_creuses

    sensor:
      - name: "Puissance de Coupure Linky"
        unique_id: linky_pcoup_estimee
        unit_of_measurement: "kVA"
        state: >
          {{ (states('sensor.intensite_souscrite_linky') | float(0) * 200 / 1000) | round(0) }}

      - name: "Index Total Consommé Linky"
        unique_id: linky_index_total_calcule
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "Wh"
        state: >
          {{ states('sensor.index_heures_pleines_filtre') | float(0)
             + states('sensor.index_heures_creuses_filtre') | float(0) }}

      - name: "Prochaine poubelle"
        state: >
          {% if is_state('input_select.poubelle_mode', 'Manuel') %}
            {{ states('input_select.poubelle_choix_manuel') }}
          {% else %}
            {{ states('input_select.poubelle_prochaine') }}
          {% endif %}

      - name: "Coût Jour"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.hp_cout_jour')|float +
              states('sensor.hc_cout_jour')|float)|round(2) }}

      - name: "Coût Semaine"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.hp_cout_semaine')|float +
              states('sensor.hc_cout_semaine')|float)|round(2) }}

      - name: "Coût Mois"
        unit_of_measurement: "€"
        state: >
          {{ (states('sensor.hp_cout_mois')|float +
              states('sensor.hc_cout_mois')|float)|round(2) }}

      - name: "Conso Jour"
        unit_of_measurement: "Wh"
        device_class: energy
        state: >
          {{ (states('sensor.hp_jour')|float +
              states('sensor.hc_jour')|float)|round(0) }}

      - name: "Conso Semaine"
        unit_of_measurement: "Wh"
        device_class: energy
        state: >
          {{ (states('sensor.hp_semaine')|float +
              states('sensor.hc_semaine')|float)|round(0) }}

      - name: "Conso Mois"
        unit_of_measurement: "Wh"
        device_class: energy
        state: >
          {{ (states('sensor.hp_mois')|float +
              states('sensor.hc_mois')|float)|round(0) }}
    
      - name: "Index Heures Pleines Filtré"
        unique_id: linky_hp_filtre_sensor
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "Wh"
        state: "{{ states('input_number.linky_hp_filtre') | float(0) }}"

      - name: "Index Heures Creuses Filtré"
        unique_id: linky_hc_filtre_sensor
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "Wh"
        state: "{{ states('input_number.linky_hc_filtre') | float(0) }}"

      - name: "Consommation HP"
        unique_id: consommation_hp
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        state: >
          {{ states('sensor.index_heures_pleines_filtre') | float(0) / 1000 }}

      - name: "Consommation HC"
        unique_id: consommation_hc
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: "kWh"
        state: >
          {{ states('sensor.index_heures_creuses_filtre') | float(0) / 1000 }}

utility_meter:
  hp_jour:
    source: sensor.index_heures_pleines_filtre
    cycle: daily

  hc_jour:
    source: sensor.index_heures_creuses_filtre
    cycle: daily

  hp_semaine:
    source: sensor.index_heures_pleines_filtre
    cycle: weekly

  hc_semaine:
    source: sensor.index_heures_creuses_filtre
    cycle: weekly

  hp_mois:
    source: sensor.index_heures_pleines_filtre
    cycle: monthly

  hc_mois:
    source: sensor.index_heures_creuses_filtre
    cycle: monthly

  consommation_hp_jour:
    source: sensor.index_heures_pleines_filtre
    cycle: daily

  consommation_hc_jour:
    source: sensor.index_heures_creuses_filtre
    cycle: daily

input_number:
  linky_hp_filtre:
    name: Linky HP filtré
    min: 0
    max: 99999999
    step: 1
    mode: box

  linky_hc_filtre:
    name: Linky HC filtré
    min: 0
    max: 99999999
    step: 1
    mode: box

input_select:
  poubelle_mode:
    name: Mode poubelle
    options:
      - Automatique
      - Manuel
    icon: mdi:calendar-sync

  poubelle_choix_manuel:
    name: Poubelle manuelle
    options:
      - Jaune
      - Noire
    icon: mdi:trash-can

  poubelle_prochaine:
    name: Prochaine poubelle
    options:
      - Jaune
      - Noire
    icon: mdi:trash-can-outline
